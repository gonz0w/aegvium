# Owned loopback TLS/TCP lab path, never an installed appliance profile.
interval 1
timeout 500
prefork 1
socket "/var/aegvium-lab-path/control.sock"
table <inspection> { 127.0.0.1 }
tcp protocol "lab_tls" {
    tls keypair "aegvium-lab"
}
relay "lab_tls" {
    listen on 127.0.0.1 port 18120 tls
    protocol "lab_tls"
    session timeout 6
    forward to <inspection> port 18084 check script "/var/aegvium-lab-readycheck" proxy-protocol v1
}
