# Owned loopback L4 profile: PROXY prefix then untouched client TLS.
interval 1
timeout 500
prefork 1
socket "/var/aegvium-lab-sender/control.sock"
table <inspection> { 127.0.0.1 }
tcp protocol "lab_passthrough" { }
relay "lab_passthrough" {
    listen on 127.0.0.1 port 18120
    protocol "lab_passthrough"
    session timeout 6
    forward to <inspection> port 18084 check script "/var/aegvium-lab-readycheck" proxy-protocol v1
}
