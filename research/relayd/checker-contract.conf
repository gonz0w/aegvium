# SPDX-License-Identifier: BSD-3-Clause
# Owned guest script-contract fixture; no backend or health listener.
interval 1
timeout 500
prefork 1
socket "/var/aegvium-contract/control.sock"
table <up> { 127.0.0.1 }
table <down> { 127.0.0.1 }
table <positive> { 127.0.0.1 }
table <signal> { 127.0.0.1 }
table <missing> { 127.0.0.1 }
table <checker> { 127.0.0.1 }
tcp protocol "contract_tcp" {}
relay "up" {
    listen on 127.0.0.1 port 18086
    protocol "contract_tcp"
    forward to <up> port 18084 check script "/var/aegvium-contract/up.sh" proxy-protocol v1
}
relay "down" {
    listen on 127.0.0.1 port 18087
    protocol "contract_tcp"
    forward to <down> port 18084 check script "/var/aegvium-contract/down.sh" proxy-protocol v1
}
relay "positive" {
    listen on 127.0.0.1 port 18088
    protocol "contract_tcp"
    forward to <positive> port 18084 check script "/var/aegvium-contract/positive.sh" proxy-protocol v1
}
relay "signal" {
    listen on 127.0.0.1 port 18089
    protocol "contract_tcp"
    forward to <signal> port 18084 check script "/var/aegvium-contract/signal.sh" proxy-protocol v1
}
relay "missing" {
    listen on 127.0.0.1 port 18090
    protocol "contract_tcp"
    forward to <missing> port 18084 check script "/var/aegvium-contract/missing.sh" proxy-protocol v1
}
relay "checker" {
    listen on 127.0.0.1 port 18091
    protocol "contract_tcp"
    forward to <checker> port 18084 check script "/var/aegvium-lab-readycheck" proxy-protocol v1
}
