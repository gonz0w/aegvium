# SPDX-License-Identifier: BSD-3-Clause
# Disposable signal comparison only; no data/health/backend service.
interval 4
timeout 3000
prefork 1
socket "/var/aegvium-signal/control.sock"
table <plain_zero> { 127.0.0.1 }
table <plain_one> { 127.0.0.1 }
table <plain_two> { 127.0.0.1 }
table <plain_term> { 127.0.0.1 }
table <plain_kill> { 127.0.0.1 }
table <observed_zero> { 127.0.0.1 }
table <observed_one> { 127.0.0.1 }
table <observed_two> { 127.0.0.1 }
table <observed_term> { 127.0.0.1 }
table <observed_kill> { 127.0.0.1 }
tcp protocol "signal_tcp" {}
relay "plain_zero" {
    listen on 127.0.0.1 port 18100
    protocol "signal_tcp"
    forward to <plain_zero> port 18084 check script "/var/aegvium-signal/plain-zero.sh" proxy-protocol v1
}
relay "plain_one" {
    listen on 127.0.0.1 port 18101
    protocol "signal_tcp"
    forward to <plain_one> port 18084 check script "/var/aegvium-signal/plain-one.sh" proxy-protocol v1
}
relay "plain_two" {
    listen on 127.0.0.1 port 18102
    protocol "signal_tcp"
    forward to <plain_two> port 18084 check script "/var/aegvium-signal/plain-two.sh" proxy-protocol v1
}
relay "plain_term" {
    listen on 127.0.0.1 port 18103
    protocol "signal_tcp"
    forward to <plain_term> port 18084 check script "/var/aegvium-signal/plain-term.sh" proxy-protocol v1
}
relay "plain_kill" {
    listen on 127.0.0.1 port 18104
    protocol "signal_tcp"
    forward to <plain_kill> port 18084 check script "/var/aegvium-signal/plain-kill.sh" proxy-protocol v1
}
relay "observed_zero" {
    listen on 127.0.0.1 port 18105
    protocol "signal_tcp"
    forward to <observed_zero> port 18084 check script "/var/aegvium-signal/observed-zero.sh" proxy-protocol v1
}
relay "observed_one" {
    listen on 127.0.0.1 port 18106
    protocol "signal_tcp"
    forward to <observed_one> port 18084 check script "/var/aegvium-signal/observed-one.sh" proxy-protocol v1
}
relay "observed_two" {
    listen on 127.0.0.1 port 18107
    protocol "signal_tcp"
    forward to <observed_two> port 18084 check script "/var/aegvium-signal/observed-two.sh" proxy-protocol v1
}
relay "observed_term" {
    listen on 127.0.0.1 port 18108
    protocol "signal_tcp"
    forward to <observed_term> port 18084 check script "/var/aegvium-signal/observed-term.sh" proxy-protocol v1
}
relay "observed_kill" {
    listen on 127.0.0.1 port 18109
    protocol "signal_tcp"
    forward to <observed_kill> port 18084 check script "/var/aegvium-signal/observed-kill.sh" proxy-protocol v1
}
