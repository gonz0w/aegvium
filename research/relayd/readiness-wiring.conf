# SPDX-License-Identifier: BSD-3-Clause
# Owned guest only: data table checked through the separate fixed health role.
interval 4
timeout 3000
prefork 1
socket "/var/aegvium-wiring/control.sock"
table <wiring> { 127.0.0.1 }
tcp protocol "wiring_tcp" {}
relay "wiring" {
    listen on 127.0.0.1 port 18120
    protocol "wiring_tcp"
    forward to <wiring> port 18084 check script "/var/aegvium-lab-readycheck" proxy-protocol v1
}
