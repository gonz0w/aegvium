# Owned loopback parser comparison; no health polling or service installation.
prefork 1
socket "/var/aegvium-body/control.sock"
table <inspection> { 127.0.0.1 }
http protocol "body_http" {
    return error
}
relay "body_http" {
    listen on 127.0.0.1 port 18080
    protocol "body_http"
    session timeout 5
    forward to <inspection> port 18081
}
tcp protocol "body_tcp" {}
relay "body_tcp" {
    listen on 127.0.0.1 port 18082
    protocol "body_tcp"
    session timeout 5
    forward to <inspection> port 18081
}
