# Foreground traffic research fixture; owned disposable guest only.
interval 1
timeout 500
prefork 1
socket "/var/aegvium-relayd/control.sock"
table <inspection> { 127.0.0.1 }
http protocol "inspection_ingress" {
    return error
}
relay "inspection_only" {
    listen on 127.0.0.1 port 18080
    protocol "inspection_ingress"
    session timeout 5
    forward to <inspection> port 18081 check http "/_aegvium/ready" host "fixture.test" code 200
}
tcp protocol "inspection_transport" {}
relay "inspection_tcp_only" {
    listen on 127.0.0.1 port 18082
    protocol "inspection_transport"
    session timeout 5
    forward to <inspection> port 18081 check http "/_aegvium/ready" host "fixture.test" code 200
}
tcp protocol "inspection_tls" {
    tls keypair "aegvium-fixture"
}
relay "inspection_tls_only" {
    listen on 127.0.0.1 port 18083 tls
    protocol "inspection_tls"
    session timeout 5
    forward to <inspection> port 18081 check http "/_aegvium/ready" host "fixture.test" code 200
}
